# ~/.config/kitty/kitty.conf

include snazzy.conf

# Fonts

font_size 12.0
disable_ligatures cursor

# The font-monaspace cask installs the static faces (MonaspaceNeon-*), not
# the variable (…Var-*) ones, so target the static PostScript names here.
# +calt/+liga give texthealing + ligatures; +dlig/+ssNN enable the coding sets.
# These must match the faces selected in the BEGIN_KITTY_FONTS block below
# (family with no style = Regular, plus the auto Bold / Italic / BoldItalic).
font_features MonaspaceNeon-Regular    +calt +liga +dlig +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08 +ss09
font_features MonaspaceNeon-Bold       +calt +liga +dlig +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08 +ss09
font_features MonaspaceNeon-Italic     +calt +liga +dlig +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08 +ss09
font_features MonaspaceNeon-BoldItalic +calt +liga +dlig +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08 +ss09


# Window

window_padding_width 5
background_opacity 0.85

# Scrollback

scrollback_lines -1

# Behaviors

copy_on_select yes
open_url_modifiers cmd

# Mappings

# Open file in vscode

# map cmd+p kitten hints --type=linenum -- code -g {path}:{line}
map cmd+p kitten hints --customize-processing mega-hints.py

# MacOS

macos_quit_when_last_window_closed yes


# BEGIN_KITTY_FONTS
font_family      family="Monaspace Neon" style=Regular
bold_font        family="Monaspace Neon" style=Bold
italic_font      family="Monaspace Neon" style=Italic
bold_italic_font family="Monaspace Neon" style="Bold Italic"
# END_KITTY_FONTS
